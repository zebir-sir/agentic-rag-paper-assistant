  <text x="125" y="518" class="h">意图规划器 + 来源策略</text><text x="88" y="540" class="p">意图、允许来源、能力、直接回答边界</text><text x="510" y="518" class="h">LangGraph 深度分析工作流</text><text x="430" y="542" class="p">范围识别 - 规划 - 检索 - 评估 - 改写/重试 - 生成 - 审阅</text><text x="925" y="518" class="h">注册检索工具</text><text x="871" y="542" class="p">向量 / 混合 / 章节 / artifact / 文档</text><text x="548" y="703" class="h">证据约束的回答运行时</text><text x="510" y="726" class="p">引用映射、支撑审阅、来源披露</text><text x="926" y="703" class="h">检索质量门</text><text x="870" y="726" class="p">评估、关键词保护、改写、有限重试</text>
