  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172b4d}.t{font-size:25px;font-weight:700}.s{font-size:13px;fill:#52606d}.band{font-size:15px;font-weight:700}.h{font-size:14px;font-weight:700}.p{font-size:11px;fill:#45576b}.blue{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}.green{fill:none;stroke:#75a95b;stroke-width:2;marker-end:url(#g)}.red{fill:none;stroke:#c66b62;stroke-width:2;marker-end:url(#r)}.dash{stroke-dasharray:6 5}</style>
  <text x="40" y="44" class="t">PaperWeave：受证据约束的科研知识工作台</text><text x="40" y="70" class="s">系统全景：异步论文入库 + 来源感知 Agentic RAG + 持久化研究空间</text>
  <g stroke="#7ea6d8"><rect x="40" y="100" width="1920" height="150" fill="#f4f7fb"/><rect x="40" y="100" width="1920" height="28" fill="#dcebfa"/></g><text x="55" y="120" class="band">1 研究工作台</text>
